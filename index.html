<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopFans | feliperei</title>
    <!-- Ícones FontAwesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #121619;
            color: #ffffff;
        }

        /* Topo */
        .navbar {
            background-color: #1b2126;
            padding: 10px 20px;
            border-bottom: 1px solid #2f3841;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Imagem e Texto do Canto Superior Esquerdo */
        .brand-logo {
            height: 48px; /* Imagem aumentada */
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            color: #00aff0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        /* Perfil */
        .profile-container {
            max-width: 700px;
            margin: 0 auto;
            background-color: #1b2126;
            border-bottom: 1px solid #2f3841;
        }

        .banner {
            height: 160px;
            background: linear-gradient(90deg, #00aff0, #0084b4);
        }

        .profile-header {
            padding: 0 20px 20px 20px;
            text-align: center;
            position: relative;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #1b2126;
            margin-top: -60px;
            object-fit: cover;
        }

        .user-details h2 {
            margin-top: 10px;
            font-size: 1.4rem;
        }

        .badge {
            color: #00aff0;
            font-size: 1.1rem;
        }

        .username {
            color: #8a96a3;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #2f3841;
            border-bottom: 1px solid #2f3841;
            margin-bottom: 15px;
        }

        .stat strong {
            display: block;
            font-size: 1.2rem;
            color: #00aff0;
        }

        .stat span {
            font-size: 0.8rem;
            color: #8a96a3;
        }

        /* Botão estático apenas com o texto Assinar por R$5/mês (sem ícone de coração) */
        .btn-subscribe {
            width: 100%;
            background-color: #00aff0;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            cursor: default;
        }

        /* Grid */
        .feed-container {
            max-width: 700px;
            margin: 20px auto;
            padding: 0 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            background-color: #1b2126;
            color: #8a96a3;
            border: 1px solid #2f3841;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .tab.active {
            color: #fff;
            border-color: #00aff0;
            background-color: #00aff0;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .post-card {
            position: relative;
            background-color: #1b2126;
            border-radius: 8px;
            overflow: hidden;
            height: 250px;
        }

        .post-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(25px); /* Conteúdo desfocado */
        }

        .lock-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            text-align: center;
            padding: 10px;
        }

        .lock-overlay i {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #00aff0;
        }

        .lock-overlay span {
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header com Imagem maior + Nome PopFans -->
    <header class="navbar">
        <img src="IMG_SEGMENT_20260913_172801.png" alt="Logo" class="brand-logo">
        <span class="logo-text">Onlyfas</span>
    </header>

    <!-- Perfil -->
    <section class="profile-container">
        <div class="banner"></div>
        <div class="profile-header">
            <!-- Sua foto de perfil -->
            <img src="IMG_20260913_171018.jpg" alt="feliperei" class="avatar">
            
            <div class="user-details">
                <h2>feliperei <i class="fa-solid fa-circle-check badge"></i></h2>
                <p class="username">@feliperei</p>
            </div>

            <!-- Stats fixos -->
            <div class="stats-bar">
                <div class="stat">
                    <strong>10</strong>
                    <span>Fotos</span>
                </div>
                <div class="stat">
                    <strong>5</strong>
                    <span>Vídeos</span>
                </div>
                <div class="stat">
                    <strong>300</strong>
                    <span>Curtidas</span>
                </div>
            </div>

            <!-- Botão estático sem ícone, apenas com o texto ASSINAR POR 5R$ -->
            <button class="btn-subscribe">
                Assinar por R$5/mês
            </button>
        </div>
    </section>

    <!-- Feed -->
    <main class="feed-container">
        <div class="tabs">
            <button class="tab active" onclick="filterContent(event, 'all')">Tudo</button>
            <button class="tab" onclick="filterContent(event, 'photo')">Fotos (10)</button>
            <button class="tab" onclick="filterContent(event, 'video')">Vídeos (5)</button>
        </div>

        <div class="posts-grid" id="postsGrid"></div>
    </main>

    <script>
        // Array com 10 fotos e 5 vídeos bloqueados
        const postsData = [
            ...Array.from({ length: 10 }, (_, i) => ({
                id: i + 1,
                type: 'photo',
                mediaSrc: `https://picsum.photos/400/500?random=${i + 1}`
            })),
            ...Array.from({ length: 5 }, (_, i) => ({
                id: i + 11,
                type: 'video',
                mediaSrc: `https://picsum.photos/400/500?random=${i + 20}`
            }))
        ];

        function renderPosts(filter = 'all') {
            const grid = document.getElementById('postsGrid');
            grid.innerHTML = '';

            const filtered = postsData.filter(post => filter === 'all' || post.type === filter);

            filtered.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';

                card.innerHTML = `
                    <img class="post-media" src="${post.mediaSrc}" alt="Conteúdo Bloqueado">
                    <div class="lock-overlay">
                        <i class="fa-solid fa-lock"></i>
                        <span>Conteúdo Exclusivo</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterContent(event, type) {
            document.querySelectorAll('.tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderPosts(type);
        }

        renderPosts();
    </script>
</body>
</html>
